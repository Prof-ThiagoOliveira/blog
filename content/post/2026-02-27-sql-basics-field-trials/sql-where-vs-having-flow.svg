<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 360" role="img" aria-labelledby="title desc">
  <title id="title">SQL query flow showing WHERE versus HAVING</title>
  <desc id="desc">Pipeline diagram for SQL order FROM JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#eef6ef"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425c82"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #1e3354; }
      .txt { font: 600 18px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #263e62; }
      .note { font: 500 16px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #2f4871; }
      .box { fill: #ffffff; stroke: #4d6b96; stroke-width: 2.5; rx: 14; }
      .where { fill: #e7f3ff; stroke: #2d6fb8; }
      .having { fill: #fff0d9; stroke: #c98317; }
      .line { fill: none; stroke: #425c82; stroke-width: 2.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="360" fill="url(#bg)"/>
  <text x="750" y="44" text-anchor="middle" class="title">SQL Logical Execution Flow WHERE vs HAVING</text>

  <rect x="40" y="120" width="200" height="80" class="box"/>
  <text x="140" y="165" text-anchor="middle" class="txt">FROM / JOIN</text>

  <rect x="280" y="120" width="180" height="80" class="box where"/>
  <text x="370" y="165" text-anchor="middle" class="txt">WHERE</text>
  <text x="370" y="187" text-anchor="middle" class="note">row filter</text>

  <rect x="500" y="120" width="180" height="80" class="box"/>
  <text x="590" y="165" text-anchor="middle" class="txt">GROUP BY</text>

  <rect x="720" y="120" width="180" height="80" class="box having"/>
  <text x="810" y="165" text-anchor="middle" class="txt">HAVING</text>
  <text x="810" y="187" text-anchor="middle" class="note">group filter</text>

  <rect x="940" y="120" width="180" height="80" class="box"/>
  <text x="1030" y="165" text-anchor="middle" class="txt">SELECT</text>

  <rect x="1160" y="120" width="250" height="80" class="box"/>
  <text x="1285" y="165" text-anchor="middle" class="txt">ORDER BY / LIMIT</text>

  <path d="M 240 160 L 280 160" class="line"/>
  <path d="M 460 160 L 500 160" class="line"/>
  <path d="M 680 160 L 720 160" class="line"/>
  <path d="M 900 160 L 940 160" class="line"/>
  <path d="M 1120 160 L 1160 160" class="line"/>

  <text x="750" y="276" text-anchor="middle" class="note">Use WHERE before grouping. Use HAVING after GROUP BY.</text>
</svg>
