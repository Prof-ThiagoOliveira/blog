<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Foreign key relationship between farms and fields</title>
  <desc id="desc">Improved diagram showing fields.farm_id referencing farms.farm_id in a one-to-many relationship with clearer table cards and flow.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="parentHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f8f7a"/>
      <stop offset="100%" stop-color="#15705f"/>
    </linearGradient>
    <linearGradient id="childHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a6dcb"/>
      <stop offset="100%" stop-color="#1f52b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2a4a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f52b6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1b2a4a">
    Foreign key relationship
  </text>
  <text x="600" y="84" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#3e5177">
    fields.farm_id references farms.farm_id
  </text>

  <rect x="70" y="120" width="450" height="285" rx="18" fill="#ffffff" stroke="#cde0f4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="120" width="450" height="62" rx="18" fill="url(#parentHead)"/>
  <text x="295" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">farms (parent)</text>

  <rect x="95" y="204" width="400" height="44" rx="10" fill="#e8faf6"/>
  <rect x="95" y="256" width="400" height="44" rx="10" fill="#f6fbff"/>
  <rect x="95" y="308" width="400" height="44" rx="10" fill="#f6fbff"/>
  <text x="118" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#135847">farm_id</text>
  <text x="442" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f6b55">PK</text>
  <text x="118" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#304769">farm_name</text>
  <text x="118" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#304769">region</text>
  <text x="95" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6f92">Example keys: 1, 2, 3</text>

  <rect x="680" y="120" width="450" height="285" rx="18" fill="#ffffff" stroke="#cde0f4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="680" y="120" width="450" height="62" rx="18" fill="url(#childHead)"/>
  <text x="905" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">fields (child)</text>

  <rect x="705" y="204" width="400" height="44" rx="10" fill="#f6fbff"/>
  <rect x="705" y="256" width="400" height="44" rx="10" fill="#eaf2ff"/>
  <rect x="705" y="308" width="400" height="44" rx="10" fill="#f6fbff"/>
  <text x="728" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#304769">field_id</text>
  <text x="1048" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#274f91">PK</text>
  <text x="728" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f52b6">farm_id</text>
  <text x="1048" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f52b6">FK</text>
  <text x="728" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#304769">field_name</text>
  <text x="705" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6f92">Example links: 101->1, 102->1, 201->2</text>

  <path d="M 706 278 C 650 330 590 332 520 282" fill="none" stroke="#1f52b6" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="548" y="186" width="126" height="30" rx="8" fill="#ffffff" stroke="#c6d8f4"/>
  <text x="611" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f52b6">FK -&gt; PK</text>

  <text x="600" y="438" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2a4a">
    One parent key can match many child rows (1:N)
  </text>

  <rect x="350" y="450" width="270" height="32" rx="9" fill="#e8faf6" stroke="#b8e9df"/>
  <text x="485" y="471" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#135847">
    farms.farm_id = 1
  </text>
  <rect x="350" y="502" width="270" height="32" rx="9" fill="#e8faf6" stroke="#b8e9df"/>
  <text x="485" y="523" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#135847">
    farms.farm_id = 2
  </text>

  <rect x="690" y="440" width="300" height="26" rx="8" fill="#eaf2ff" stroke="#cadcf8"/>
  <text x="840" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f52b6">
    field 101, farm_id = 1
  </text>
  <rect x="690" y="472" width="300" height="26" rx="8" fill="#eaf2ff" stroke="#cadcf8"/>
  <text x="840" y="490" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f52b6">
    field 102, farm_id = 1
  </text>
  <rect x="690" y="504" width="300" height="26" rx="8" fill="#eaf2ff" stroke="#cadcf8"/>
  <text x="840" y="522" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f52b6">
    field 201, farm_id = 2
  </text>
  <rect x="690" y="536" width="300" height="26" rx="8" fill="#eaf2ff" stroke="#cadcf8"/>
  <text x="840" y="554" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f52b6">
    field 202, farm_id = 2
  </text>

  <path d="M 620 466 C 645 460 665 454 690 453" fill="none" stroke="#325992" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 620 466 C 645 476 665 482 690 485" fill="none" stroke="#325992" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 620 518 C 645 514 665 514 690 517" fill="none" stroke="#325992" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 620 518 C 645 534 665 544 690 549" fill="none" stroke="#325992" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="220" y="570" width="760" height="30" rx="10" fill="#ffffff" stroke="#d8e5f6"/>
  <text x="600" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3e5177">
    Referential integrity: every fields.farm_id must exist in farms.farm_id before insert/update succeeds.
  </text>
</svg>
