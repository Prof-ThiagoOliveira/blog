<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">INNER JOIN vs LEFT JOIN concept view</title>
  <desc id="desc">Two side-by-side panels showing matched rows only for INNER JOIN and all left rows for LEFT JOIN.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f3fbf5"/>
    </linearGradient>
    <style>
      .title { font: 700 30px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #1e3455; }
      .panel { fill: #ffffff; stroke: #4d6b95; stroke-width: 2.2; rx: 14; }
      .head { font: 700 22px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #1f3558; }
      .txt { font: 500 17px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #2d466e; }
      .tbl { fill: #eef4ff; stroke: #6888b5; stroke-width: 1.8; rx: 8; }
      .rowL { fill: #deecff; stroke: #6e90bf; stroke-width: 1.4; }
      .rowR { fill: #ffe8e8; stroke: #c27474; stroke-width: 1.4; }
      .match { fill: #dff7e4; stroke: #4d9961; stroke-width: 1.4; }
      .null { fill: #f8f1ff; stroke: #8b70b3; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="540" fill="url(#bg)"/>
  <text x="800" y="42" text-anchor="middle" class="title">JOIN Behavior: INNER vs LEFT</text>

  <rect x="40" y="80" width="740" height="420" class="panel"/>
  <text x="410" y="118" text-anchor="middle" class="head">INNER JOIN</text>
  <text x="410" y="145" text-anchor="middle" class="txt">Only rows with matches on both sides</text>

  <rect x="90" y="170" width="220" height="250" class="tbl"/>
  <text x="200" y="196" text-anchor="middle" class="txt">Left table (fields)</text>
  <rect x="105" y="212" width="190" height="38" class="rowL"/>
  <text x="200" y="236" text-anchor="middle" class="txt">field_id = 1</text>
  <rect x="105" y="256" width="190" height="38" class="rowL"/>
  <text x="200" y="280" text-anchor="middle" class="txt">field_id = 2</text>
  <rect x="105" y="300" width="190" height="38" class="rowL"/>
  <text x="200" y="324" text-anchor="middle" class="txt">field_id = 3</text>

  <rect x="470" y="170" width="220" height="250" class="tbl"/>
  <text x="580" y="196" text-anchor="middle" class="txt">Right table (harvests)</text>
  <rect x="485" y="212" width="190" height="38" class="rowR"/>
  <text x="580" y="236" text-anchor="middle" class="txt">field_id = 1</text>
  <rect x="485" y="256" width="190" height="38" class="rowR"/>
  <text x="580" y="280" text-anchor="middle" class="txt">field_id = 3</text>

  <rect x="322" y="244" width="136" height="38" class="match"/>
  <text x="390" y="268" text-anchor="middle" class="txt">1, 3 only</text>

  <rect x="820" y="80" width="740" height="420" class="panel"/>
  <text x="1190" y="118" text-anchor="middle" class="head">LEFT JOIN</text>
  <text x="1190" y="145" text-anchor="middle" class="txt">All left rows stay; missing right values become NULL</text>

  <rect x="870" y="170" width="220" height="250" class="tbl"/>
  <text x="980" y="196" text-anchor="middle" class="txt">Left table (fields)</text>
  <rect x="885" y="212" width="190" height="38" class="rowL"/>
  <text x="980" y="236" text-anchor="middle" class="txt">field_id = 1</text>
  <rect x="885" y="256" width="190" height="38" class="rowL"/>
  <text x="980" y="280" text-anchor="middle" class="txt">field_id = 2</text>
  <rect x="885" y="300" width="190" height="38" class="rowL"/>
  <text x="980" y="324" text-anchor="middle" class="txt">field_id = 3</text>

  <rect x="1250" y="170" width="220" height="250" class="tbl"/>
  <text x="1360" y="196" text-anchor="middle" class="txt">Right values</text>
  <rect x="1265" y="212" width="190" height="38" class="match"/>
  <text x="1360" y="236" text-anchor="middle" class="txt">match for 1</text>
  <rect x="1265" y="256" width="190" height="38" class="null"/>
  <text x="1360" y="280" text-anchor="middle" class="txt">NULL for 2</text>
  <rect x="1265" y="300" width="190" height="38" class="match"/>
  <text x="1360" y="324" text-anchor="middle" class="txt">match for 3</text>
</svg>
