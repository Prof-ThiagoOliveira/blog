# =====================================================
# Language Configuration
# =====================================================
# Define language codes and optional content directories.
# For multi-lingual sites, create content/[lang] folders
# and uncomment contentDir for each language.
# Docs: https://docs.hugoblox.com/reference/language/

# Primary language: English (US)
en:
  languageCode: en-us
  # Uncomment to move English content into content/en/ subfolder
  # contentDir: content/en

